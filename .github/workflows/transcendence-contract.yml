name: Transcendence Contract Validation
on:
  push:
    paths:
      - "schemas/transcendence/**"
      - "examples/transcendence/**"
      - ".github/scripts/transcendence_contract.py"
      - ".github/workflows/transcendence-contract.yml"
  pull_request:
    paths:
      - "schemas/transcendence/**"
      - "examples/transcendence/**"
      - ".github/scripts/transcendence_contract.py"
      - ".github/workflows/transcendence-contract.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install schema and signature validators
        run: python -m pip install 'jsonschema>=4.23,<5' 'cryptography>=44,<47'
      - name: Validate Transcendence contracts and signed continuity evidence
        run: python .github/scripts/transcendence_contract.py
