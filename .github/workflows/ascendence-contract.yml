name: Ascendence Contract Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install schema and signature validators
        run: python -m pip install 'jsonschema>=4.23,<5' 'cryptography>=44,<47'
      - name: Validate bounded Ascendence contracts and signed evidence
        run: python .github/scripts/ascendence_contract.py
